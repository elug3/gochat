version: '3'
services:
  nats-server:
    image: nats:2.11
    container_name: nats
    command: ["-js"]

  contacts:
    build:
      context: .
      dockerfile: ./cmd/gochat-contacts_server/Dockerfile
    container_name: gochat-contacts_server
    environment:
      - NATS_URL=nats://nats-server:4222
      - S3_ENDPOINT=http://bucket:9000
    depends_on:
      - nats-server
  auth:
    build:
      context: .
      dockerfile: ./cmd/gochat-auth_server/Dockerfile
    container_name: gochat-auth_server
    environment:
      - NATS_URL=nats://nats-server:4222
    depends_on:
      - nats-server
  chatcmd:
    build:
      context: .
      dockerfile: ./cmd/gochat-chatcmd_server/Dockerfile
    container_name: gochat-chatcmd_server
    environment:
      - DB_URL=chatview-db:6379
      - NATS_URL=nats://nats-server:4222
    depends_on:
      - chatview-db
      - nats-server
  chatview:
    build:
      context: .
      dockerfile: ./cmd/gochat-chatview_server/Dockerfile
    container_name: gochat-chatview_server
    environment:
      - DB_URL=chatview-db:6379
      - NATS_URL=nats://nats-server:4222
    depends_on:
      - nats-server
      - chatview-db
  messages:
    build:
      context: .
      dockerfile: ./cmd/gochat-message_server/Dockerfile
    container_name: gochat-message_server
    environment:
      - CONTACTS_SERVER=contacts:8080
      - NATS_URL=nats://nats-server:4222
    depends_on:
      - nats-server
  ws:
    build:
      context: .
      dockerfile: ./cmd/ws-server/Dockerfile
    container_name: ws-server
    environment:
      - AUTH_SERVER=auth:8080
      - CONTACTS_SERVER=contacts:8080
      - NATS_URL=nats://nats-server:4222
    depends_on:
      - nats-server
      - auth
      - contacts
    ports:
      - "12345:12345"

  krakend:
    image: krakend:2.10
    container_name: krakend
    volumes:
      - ./krakend.json:/etc/krakend/krakend.json
    ports:
      - "8080:8080"
    command: ["run", "-c", "/etc/krakend/krakend.json", "-d"]


  chatview-db:
    image: redis:8.2
    container_name: chatview-db

  presence:
    build:
      context: .
      dockerfile: ./cmd/gochat-presence_server/Dockerfile
    container_name: gochat-presence_server
    environment:
      - NATS_URL=nats://nats-server:4222
      - REDIS_URL=presence-db:6379
    depends_on:
      - nats-server
      - presence-db
  presence-event:
    build:
      context: .
      dockerfile: ./cmd/gochat-presence_event_server/Dockerfile
    container_name: gochat-presence_event_server
    environment:
      - NATS_URL=nats://nats-server:4222
      - REDIS_URL=presence-db:6379
    depends_on:
      - nats-server
      - presence-db
  presence-db:
    image: redis:8.2
    container_name: presence-db
  avatar:
    build:
      context: .
      dockerfile: ./cmd/gochat-avatar_server/Dockerfile
    container_name: gochat-avatar_server
    environment:
      - NATS_URL=nats://nats-server:4222
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    depends_on:
      - nats-server
      - minio

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;

      # create bucket if it doesn't exist
      mc mb -p local/avatars || true;

      # set bucket policy: public download (public read)
      mc anonymous set download local/avatars;

      echo 'MinIO buckets/policies initialized.';
      "
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
  nats-init:
    image: synadia/nats-server:nightly-20251218
    container_name: nats-init
    depends_on:
      - nats-server
    entrypoint: >
      sh -c "
      echo 'Creating APP_STREAM (if not exists)...';
      nats --server nats:4222 stream add APP_STREAM --subjects 'CONTACTS.>' --subjects 'AUTH.>' --subjects 'MESSAGE.>' --storage file --retention limits --max-msgs -1 --max-bytes -1 --max-age 72h --discard old || true;

      echo 'Done.'-

      "

volumes:
  minio_data:

syntax = "proto3";

package auth;

option go_package = "github.com/elug3/api/grpc/auth;authpb";


message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    int32 user_id = 1;
    string access_token = 2;
    int64 expires_in = 3;
}

message CreateCredentialsRequest {
    int32 user_id = 1;
    string username = 2;
    string password = 3;
}

message CreateCredentialsResponse {
    bool success = 1;
}

service AuthService {
    rpc CreateCredentials(CreateCredentialsRequest) returns (CreateCredentialsResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
}
